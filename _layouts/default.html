<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #1a1a1a;
        background: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 2rem;
      }

      .site {
        max-width: 440px;
        text-align: center;
      }

      .portrait {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        object-position: 65% center;
        margin-bottom: 1.5rem;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }

      p {
        font-size: 1.05rem;
        line-height: 1.6;
        color: #333;
        margin-bottom: 1.25rem;
      }

      a {
        color: #1a1a1a;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      a:hover {
        color: #555;
      }

      .links {
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <div class="site">
      <img class="portrait" src="/img/portrait.jpeg" alt="{{ site.title }}">
      <h1>{{ site.title }}</h1>
      {{ content }}
    </div>
  </body>
</html>
